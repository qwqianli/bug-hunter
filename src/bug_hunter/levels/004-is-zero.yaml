id: 004-is-zero
title: 相等
difficulty: 4
tags:
  - numeric
  - 数值精度
  - 浮点比较
intro: is_zero 判断一个数是不是零。它对整数总是对的。
broken_code: |
  def is_zero(x):
      return x == 0.0    # 浮点运算的结果，也正好等于 0.0 吗
correct_code: |
  def is_zero(x):
      return abs(x) < 1e-9
hints:
  - 试一个看起来是 0 的表达式
  - 0.1 + 0.2 - 0.3 等于 0 吗
reference_test: |
  from target import is_zero

  def test_looks_like_zero():
      assert is_zero(0.1 + 0.2 - 0.3)
