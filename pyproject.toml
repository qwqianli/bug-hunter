[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-hunter"
version = "0.1.0"
description = "一个不能改代码、只能写测试来通关的游戏"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "pytest>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["flask>=3.0"]

[project.scripts]
bug-hunter = "bug_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bug_hunter = ["levels/*.yaml", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
