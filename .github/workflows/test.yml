name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --color=no

      - name: Check every level is solvable
        run: python scripts/check_levels.py

      - name: Verify the package contains all level files
        run: |
          python -c "
          import pathlib
          import bug_hunter
          levels = list((pathlib.Path(bug_hunter.__file__).parent / 'levels').glob('*.yaml'))
          print(f'levels found: {len(levels)}')
          assert len(levels) >= 15, f'expected at least 15 levels, got {len(levels)}'
          "
